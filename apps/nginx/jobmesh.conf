# FILE: apps/nginx/jobmesh.conf
# Production vhosts for the subdomain architecture (NAMING-CONVENTIONS §17).
# Audience hosts all proxy to Next on :3001; only api.jobmesh.in reaches Express
# on :3000. Next's middleware.ts reads the Host header and rewrites into the
# matching route group, so one Next process serves every audience.
#
# Install + SSL + DNS: see apps/nginx/README.md.

# Redirect www to the bare domain.
server {
    listen 80;
    listen [::]:80;
    server_name www.jobmesh.in;
    return 301 https://jobmesh.in$request_uri;
}

# Redirect all plain HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name jobmesh.in *.jobmesh.in;

    # Certbot's HTTP-01 challenge must not be swallowed by the redirect. The
    # wildcard cert needs DNS-01, but the apex renewal can still use HTTP-01.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# www over TLS — redirect after the handshake (the cert covers it).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.jobmesh.in;

    ssl_certificate     /etc/letsencrypt/live/jobmesh.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobmesh.in/privkey.pem;

    return 301 https://jobmesh.in$request_uri;
}

# Audience hosts → Next.js.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jobmesh.in hire.jobmesh.in admin.jobmesh.in apply.jobmesh.in health.jobmesh.in;

    ssl_certificate     /etc/letsencrypt/live/jobmesh.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobmesh.in/privkey.pem;

    # Security headers.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Resume + logo + assignment uploads post through the Next tier too.
    client_max_body_size 50M;

    # Immutable build assets. Declared BEFORE `location /` for clarity; nginx
    # prefix-matching picks the longest match regardless of order.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        # Host MUST be forwarded verbatim — middleware.ts routes on it. Rewriting
        # it to the upstream address would collapse every audience onto seeker.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}

# API host → Express.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.jobmesh.in;

    ssl_certificate     /etc/letsencrypt/live/jobmesh.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobmesh.in/privkey.pem;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Resumes, company logos, bulk-import ZIPs.
    client_max_body_size 50M;

    # Monitoring probe: fail fast rather than queue behind a slow database.
    location /api/health {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 5s;
        access_log off;
    }

    # Crawlers never belong on the API host.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }
}

# Unknown subdomain → 444 (close without a response) so foo.jobmesh.in never
# lands on a real audience by falling through to the first server block.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/jobmesh.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobmesh.in/privkey.pem;

    return 444;
}
